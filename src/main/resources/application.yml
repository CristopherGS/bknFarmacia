
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jackson:
    time-zone: America/Guatemala

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Solo se aplican al crear la base por primera vez; después se cambian desde Configuración.
  business:
    name: ${BUSINESS_NAME:}
    type: ${BUSINESS_TYPE:}
  # Portafolio personal de ETFs: solo se activa si INVEST_OWNER es tu usuario administrador.
  # Las llaves son opcionales; sin ellas se usan las fuentes públicas sin llave.
  invest:
    owner: ${INVEST_OWNER:}
    fred-key: ${FRED_API_KEY:}
    finnhub-token: ${FINNHUB_TOKEN:}
    twelvedata-key: ${TWELVEDATA_KEY:}
    telegram-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-chat: ${TELEGRAM_CHAT_ID:}
    cron: ${INVEST_CRON:0 30 22 * * MON-FRI}
  outbox:
    interval-ms: ${OUTBOX_INTERVAL_MS:5000}
    backoff-seconds: ${OUTBOX_BACKOFF_SECONDS:10}
  cash:
    automatic: ${CASH_AUTOMATIC:true}
    opening-amount: ${CASH_OPENING_AMOUNT:0.00}
