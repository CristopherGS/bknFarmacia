
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/farmacia}
    username: ${DATABASE_USERNAME:farmacia}
    password: ${DATABASE_PASSWORD}

  jackson:
    time-zone: America/Guatemala

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cash:
    automatic: ${CASH_AUTOMATIC:true}
    opening-amount: ${CASH_OPENING_AMOUNT:0.00}
