
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jackson:
    time-zone: America/Guatemala

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cash:
    automatic: ${CASH_AUTOMATIC:true}
    opening-amount: ${CASH_OPENING_AMOUNT:0.00}
